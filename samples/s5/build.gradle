
buildscript {

    ext.propsFile = new File(rootDir.getParent(), 'samples.properties')
    apply from: propsFile

    repositories {
        mavenCentral()
    }
    dependencies {
	 classpath("org.springframework.boot:spring-boot-gradle-plugin:" + boot4Version)
    }
}

apply plugin: 'java'
apply plugin: 'org.springframework.boot'

// Look for a local copy of the dependencies as well as in Maven Central (if not already cached)
repositories {
  mavenLocal()
  mavenCentral()
}

dependencies {
  implementation("com.ibm.mq:mq-jms-spring-boot-starter:" + mqBoot4StarterVersion)
  testImplementation("com.ibm.mq:mq-jms-spring-testcontainer:" + mqBoot4StarterVersion)
  testImplementation("org.springframework.boot:spring-boot-starter-test:" + boot4Version) {
    // We seem to get two versions of the org.json classes. Since we're not doing anything with
    // android, exclude it to avoid any warning messages.
    exclude(module:'android-json')
  }
  testImplementation 'org.junit.jupiter:junit-jupiter-api: ' + jUnitVersion
  testRuntimeOnly    'org.junit.jupiter:junit-jupiter-engine:' + jUnitVersion
  testRuntimeOnly    'org.junit.platform:junit-platform-launcher:' + jUnitVersion

}

test {
  useJUnitPlatform()
  jvmArgs "-javaagent:${configurations.testRuntimeClasspath.find { it.name.contains('mockito-core') }}", '-Xshare:off'
  testLogging {
      events "PASSED", "SKIPPED", "FAILED", "STANDARD_OUT", "STANDARD_ERROR"
  }
}

